services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-social_media_mgmt_aligned}
    command: ['--default-time-zone=+00:00']
    ports: ['127.0.0.1:3307:3306']
    volumes: ['mysql-data:/var/lib/mysql']
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    command: ['python', '-m', 'scripts.migrate']
    depends_on:
      db: { condition: service_healthy }
  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    ports: ['3000:3000']
    volumes: ['media-data:/app/storage']
    depends_on:
      migrate: { condition: service_completed_successfully }
  worker:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    command: ['python', '-m', 'app.worker']
    volumes: ['media-data:/app/storage']
    depends_on:
      migrate: { condition: service_completed_successfully }
volumes:
  mysql-data:
  media-data:
