name: FastAPI checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -ptest-password" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: test
      SOCIAL_MODE: mock
      MAIL_MODE: file
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: test-password
      DB_NAME: team14_api_test_ci
      STORAGE_DIR: .runtime/test-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: |
          python -c "import secrets,base64; print('TOKEN_ENCRYPTION_KEY='+base64.b64encode(secrets.token_bytes(32)).decode())" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: python -m ruff check app scripts tests
      - run: python -m ruff format --check app scripts tests
      - run: python -m scripts.migrate
      - run: python -m pytest --integration -q
      - run: python -m scripts.export_openapi && git diff --exit-code -- docs/openapi.json
